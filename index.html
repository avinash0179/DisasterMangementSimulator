<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Disaster Response Simulator</title>

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link rel="stylesheet" href="style.css">

</head>

<body>

<header>
<h1>🚨 Disaster Response Simulator</h1>
</header>

<div class="dashboard">

<div class="card">

<h3>Disaster Control</h3>

<select id="disasterType">
<option>Fire</option>
<option>Flood</option>
<option>Earthquake</option>
<option>Accident</option>
</select>

<button onclick="startSimulation()">Start Simulation</button>

</div>

<div class="card">

<h3>Rescue Operation</h3>

<button onclick="assignTeam()">Assign Rescue Team</button>

<button onclick="generateReport()">Generate Report</button>

<p id="report"></p>

</div>

</div>


<div class="tableCard">

<h2>Victim Monitoring</h2>

<table id="victimTable">

<thead>
<tr>
<th>ID</th>
<th>Health</th>
<th>Priority</th>
<th>Status</th>
</tr>
</thead>

<tbody></tbody>

</table>

</div>


<script src="script.js"></script>

</body>
</html>
