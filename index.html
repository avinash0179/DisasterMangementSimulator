<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Disaster Response Simulator</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

<link rel="stylesheet" href="style.css">
</head>

<body>

<nav class="navbar navbar-dark bg-danger">
<div class="container-fluid">
<span class="navbar-brand mb-0 h1">🚨 Disaster Response Simulator</span>
</div>
</nav>

<div class="container mt-4">

<div class="row g-4">

<!-- Disaster Selection -->
<div class="col-md-4">
<div class="card shadow">
<div class="card-body">
<h5 class="card-title">Select Disaster</h5>

<select id="disasterType" class="form-select mb-3">
<option value="Fire">🔥 Fire</option>
<option value="Flood">🌊 Flood</option>
<option value="Earthquake">🌍 Earthquake</option>
<option value="Accident">🚑 Accident</option>
</select>

<button class="btn btn-danger w-100" onclick="startSimulation()">
Start Simulation
</button>

</div>
</div>
</div>

<!-- Rescue Teams -->
<div class="col-md-4">
<div class="card shadow">
<div class="card-body">
<h5 class="card-title">Rescue Teams</h5>

<p>Available Teams</p>

<ul class="list-group mb-3">
<li class="list-group-item">Medical Team</li>
<li class="list-group-item">Fire Rescue Team</li>
<li class="list-group-item">Emergency Response Team</li>
</ul>

<button class="btn btn-primary w-100" onclick="assignTeam()">
Assign Rescue Team
</button>

</div>
</div>
</div>

<!-- Report -->
<div class="col-md-4">
<div class="card shadow">
<div class="card-body">

<h5 class="card-title">Simulation Report</h5>

<button class="btn btn-success w-100 mb-3" onclick="generateReport()">
Generate Report
</button>

<p id="report" class="text-success fw-bold"></p>

</div>
</div>
</div>

</div>

<!-- Victim Table -->
<div class="row mt-4">

<div class="col-12">
<div class="card shadow">

<div class="card-body">

<h4 class="card-title">Victim Monitoring</h4>

<div class="table-responsive">

<table class="table table-striped" id="victimTable">

<thead class="table-dark">
<tr>
<th>ID</th>
<th>Health Status</th>
<th>Priority</th>
<th>Status</th>
</tr>
</thead>

<tbody></tbody>

</table>

</div>
</div>
</div>
</div>

</div>

</div>

<script src="script.js"></script>

</body>
</html>
