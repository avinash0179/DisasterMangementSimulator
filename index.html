<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<title>Login - Disaster Simulator</title>

<link rel='stylesheet'
href='https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.14.0/css/all.min.css'>

<link rel="stylesheet" href="login.css">

</head>

<body>

<div class="container" id="container">

<!-- SIGN UP -->

<div class="form-container sign-up-container">

<form>

<h1>Create Account</h1>

<span>Use email for registration</span>

<input type="text" id="signupName" placeholder="Name"/>
<input type="email" id="signupEmail" placeholder="Email"/>
<input type="password" id="signupPassword" placeholder="Password"/>

<button type="button" onclick="signup()">Sign Up</button>

</form>

</div>

<!-- SIGN IN -->

<div class="form-container sign-in-container">

<form>

<h1>Sign In</h1>

<span>Use your account</span>

<input type="email" id="email" placeholder="Email"/>
<input type="password" id="password" placeholder="Password"/>

<p id="loginError" class="error"></p>

<button type="button" id="loginBtn" onclick="login()">
<span id="btnText">Sign In</span>
<span id="btnDots" class="dots" style="display:none;">
<span>.</span><span>.</span><span>.</span>
</span>
</button>

<div id="loader" class="loader" style="display:none;"></div>

</form>

</div>

<!-- OVERLAY -->

<div class="overlay-container">

<div class="overlay">

<div class="overlay-panel overlay-left">

<h1>Welcome Back!</h1>

<p>Login with your account</p>

<button class="ghost" id="signIn">Sign In</button>

</div>

<div class="overlay-panel overlay-right">

<h1>Hello, User!</h1>

<p>Enter details to start using the simulator</p>

<button class="ghost" id="signUp">Sign Up</button>

</div>

</div>

</div>

</div>

<script src="login.js"></script>

</body>
</html>
